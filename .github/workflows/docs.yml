name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Clean site
        run: rm -rf site

      - name: Copy shared assets
        run: |
          mkdir -p docs/en/assets
          mkdir -p docs/en/stylesheets
          mkdir -p docs/lt/assets
          mkdir -p docs/lt/stylesheets

          cp docs/shared/assets/techin-brand.svg docs/en/assets/techin-brand.svg
          cp docs/shared/assets/techin-brand.svg docs/lt/assets/techin-brand.svg

          cp docs/shared/stylesheets/extra.css docs/en/stylesheets/extra.css
          cp docs/shared/stylesheets/extra.css docs/lt/stylesheets/extra.css

      - name: Generate navigation configs
        run: uv run python scripts/generate_config.py

      - name: Build English
        run: uv run zensical build -f zensical.en.generated.toml

      - name: Build Lithuanian
        run: uv run zensical build -f zensical.lt.generated.toml

      - name: Create root redirect
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta http-equiv="refresh" content="0; url=./en/">
              <title>Learning Materials</title>
          </head>
          <body>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
