[project]
site_name = "Learning Materials"
site_description = "Programming learning materials"

# Source directory with Markdown and shared assets
docs_dir = "docs/en"
# Output directory for the English build
site_dir = "site/en"
# Public production URL for the English site
site_url = "https://rokiis1.github.io/Teaching-Materia/en/"

# GitHub repository integration
# repo_url = "https://github.com/Rokiis1/Teaching-Materia"
# repo_name = "Rokiis1/Teaching-Materia"
# edit_uri = "edit/main/docs/"

# Navigation is generated from config/nav/

# Additional custom stylesheet
extra_css = ["stylesheets/extra.css"]

# Theme configuration
[project.theme]
variant = "classic"
language = "en"
logo = "assets/techin-brand.svg"

# Enabled theme features
features = [
  "announce.dismiss",

  # Code-related features
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",

  # Navigation features
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",

  # Search features
  "search.highlight",
  "search.suggest",
]


[project.extra]
# Language selector shown in the heade
alternate = [
  { name = "English", link = "/Teaching-Materia/en/", lang = "en" },
  { name = "Lithuanian", link = "/Teaching-Materia/lt/", lang = "lt" },
]

# Theme color scheme / mode switcher

# Follow operating system preference
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


[project.markdown_extensions]

# Standard Markdown extensions
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

# Adds permalink anchors to headings
toc.permalink = true

# Math support
pymdownx.arithmatex.generic = true

# Text formatting extensions
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}

# Emoji support
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"

# Syntax highlighting
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true

# Inline and utility Markdown extensions
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}

# Mermaid diagrams
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Content tabs
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true

# Task lists
pymdownx.tasklist.custom_checkbox = true

# Strikethrough and related syntax
pymdownx.tilde = {}